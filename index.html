    <!-- Extension Guard: Suppress Chrome Extension inpage.js connection errors from crashing host harness -->
    <script>
      (function() {
        function isExtensionError(msg, src, err) {
          var str = [msg, src, (err && err.message), (err && err.stack)].join(' ');
          return str.indexOf('MetaMask') !== -1 ||
                 str.indexOf('inpage.js') !== -1 ||
                 str.indexOf('chrome-extension://') !== -1 ||
                 str.indexOf('Failed to connect') !== -1;
        }

        var origOnError = window.onerror;
        window.onerror = function(msg, src, lineno, colno, err) {
          if (isExtensionError(msg, src, err)) {
            console.warn('[Extension Guard Suppressed]', msg);
            return true;
          }
          if (origOnError) return origOnError.apply(this, arguments);
        };

        window.addEventListener('error', function(e) {
          if (isExtensionError(e.message, e.filename, e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
          if (isExtensionError(reason, '', e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
